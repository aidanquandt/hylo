<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hylo host</title>
  <style>
    :root {
      --bg: #1a1b26;
      --surface: #24283b;
      --surface2: #2d3047;
      --text: #c0caf5;
      --accent: #7aa2f7;
      --success: #9ece6a;
      --error: #f7768e;
      --muted: #565f89;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-size: 0.9rem;
    }
    h1 { font-size: 1.1rem; margin: 0 0 0.4rem 0; color: var(--accent); flex-shrink: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar label { margin: 0; font-size: 0.85rem; }
    .toolbar select, .toolbar input[type="text"] {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
    }
    .toolbar select { min-width: 10rem; }
    .toolbar input[type="text"] { min-width: 12rem; }
    .command-list { max-width: 56rem; }
    .command {
      background: var(--surface);
      border-radius: 4px;
      padding: 0.35rem 0.6rem;
      margin-bottom: 0.25rem;
    }
    .command.hidden { display: none; }
    .command-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .command-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .command-desc { font-size: 0.75rem; color: var(--muted); }
    .command-form {
      margin-top: 0.35rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .arg-group {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .arg-group label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .arg-group input, .arg-group select {
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--bg);
      color: var(--text);
      font-size: 0.8rem;
      min-width: 4rem;
    }
    .command-form button {
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .command-form button:hover:not(:disabled) { filter: brightness(1.1); }
    .command-form button:disabled { opacity: 0.7; cursor: not-allowed; }
    .command-response-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }
    .command-response {
      flex: 1;
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      min-height: 1.2rem;
    }
    .command-response.success { color: var(--success); background: rgba(158, 206, 106, 0.1); }
    .command-response.error { color: var(--error); background: rgba(247, 118, 142, 0.1); }
    .command-response.pending { color: var(--muted); }
    .copy-response {
      display: none;
      padding: 0.15rem 0.35rem;
      font-size: 0.7rem;
      border-radius: 3px;
      border: 1px solid var(--muted);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }
    .command-response-row.has-success .copy-response { display: inline-block; }
    .copy-response:hover { background: var(--surface2); filter: brightness(1.1); }
    .toolbar .btn-refresh {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toolbar .btn-refresh:hover { filter: brightness(1.1); }
    .btn-monitor {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: var(--surface);
      color: var(--accent);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-monitor:hover { filter: brightness(1.1); }
    .btn-monitor.active {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-transport {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--success);
      background: var(--surface);
      color: var(--success);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-transport.active {
      background: var(--success);
      color: var(--bg);
    }
    .monitor-status { font-size: 0.8rem; color: var(--muted); }
    .load-err { color: var(--error); padding: 0.5rem 0; font-size: 0.85rem; }
    .no-results { color: var(--muted); padding: 0.25rem 0; font-size: 0.85rem; }
    .module-section { margin-bottom: 0.75rem; }
    .module-section.hidden { display: none; }
    .module-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.25rem;
      padding: 0.2rem 0;
      cursor: pointer;
      user-select: none;
    }
    .module-header:hover { opacity: 0.9; }
    .module-header::before { content: "▾ "; }
    .module-section.collapsed .module-header::before { content: "▸ "; }
    .module-section.collapsed .module-commands { display: none; }
    /* Two-panel layout: fixed viewport, left/right scroll independently like fixed windows */
    .app-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0.5rem 1rem;
      overflow: hidden;
    }
    .app-main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      gap: 0;
    }
    .panel-commands {
      flex: 0 1 50%;
      min-width: 20rem;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: flex-basis 0.2s ease;
    }
    .panel-events {
      flex: 1 1 50%;
      min-width: 18rem;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--surface2);
      background: var(--bg);
      transition: flex-basis 0.2s ease;
    }
    /* When viz tab is active, give most space to the right panel */
    .app-main.viz-active .panel-commands { flex: 0 0 22rem; min-width: 16rem; }
    .app-main.viz-active .panel-events { flex: 1 1 auto; }
    .event-log-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4rem 0.6rem;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
      font-size: 0.85rem; font-weight: 600; color: var(--accent);
    }
    .event-log-header .btn-clear {
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
    }
    .event-log-header .btn-clear:hover { filter: brightness(1.1); }
    .event-log-header .btn-jump {
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      margin-right: 0.25rem;
    }
    .event-log-header .btn-jump:hover { filter: brightness(1.1); }
    .event-log-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 0.78rem;
      padding: 0.5rem;
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .event-log-line {
      padding: 0.15rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--muted);
    }
    .event-log-line .event-prefix { color: var(--accent); }
    .event-log-empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }

    /* --- Tab bar for right panel --- */
    .tab-bar {
      display: flex;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
    }
    .tab-bar button {
      padding: 0.4rem 1rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .tab-bar button:hover { color: var(--text); }
    .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }

    /* --- Visualization panel --- */
    .viz-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    .viz-canvas-wrap { flex: 1; min-height: 0; position: relative; background: #0d1117; }
    .viz-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
    .viz-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.5rem;
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      font-size: 0.78rem;
      flex-wrap: wrap;
    }
    .viz-toolbar button {
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .viz-toolbar button:hover { filter: brightness(1.1); }
    .viz-toolbar .viz-status { color: var(--muted); margin-left: auto; }
    .anchor-config {
      flex-shrink: 0;
      max-height: 9rem;
      overflow-y: auto;
      padding: 0.3rem 0.5rem;
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      font-size: 0.75rem;
    }
    .anchor-config table { width: 100%; border-collapse: collapse; }
    .anchor-config th { text-align: left; color: var(--muted); padding: 0.15rem 0.3rem; font-weight: 500; }
    .anchor-config td { padding: 0.1rem 0.3rem; }
    .anchor-config input {
      width: 4.5rem; padding: 0.1rem 0.25rem; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: var(--text); font-size: 0.75rem;
    }
    .anchor-config .btn-add, .anchor-config .btn-del, .anchor-config .btn-apply {
      padding: 0.1rem 0.3rem; border-radius: 3px; border: none;
      cursor: pointer; font-size: 0.7rem;
    }
    .anchor-config .btn-add { background: var(--accent); color: var(--bg); }
    .anchor-config .btn-del { background: var(--error); color: #fff; }
    .anchor-config .btn-apply { background: var(--success); color: var(--bg); }
    .anchor-config .btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }
    .anchor-config .btn-apply.sent { background: var(--muted); }
  </style>
</head>
<body>
  <div class="app-body">
    <h1>Hylo host</h1>
    <div class="toolbar">
      <label for="port">Port</label>
      <select id="port">
        <option value="">Loading…</option>
      </select>
      <button type="button" id="refreshPorts" class="btn-refresh" title="Refresh port list">⟳</button>
      <button type="button" id="monitorBtn" class="btn-monitor" title="Start background monitoring so event log receives all device messages (e.g. TWR range, logs)">Start monitoring</button>
      <span id="monitorStatus" class="monitor-status" style="display: none;"></span>
      <label for="commRoute">Route via</label>
      <select id="commRoute" title="Select host communication route">
        <option value="uart">UART</option>
        <option value="wifi">WiFi</option>
      </select>
      <span id="transportStatus" class="monitor-status" style="display: none;"></span>
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="Filter commands…" />
    </div>
    <div class="app-main">
      <div class="panel-commands">
        <div id="commandList" class="command-list"></div>
        <div id="noResults" class="no-results" style="display: none;">No commands match.</div>
        <div id="loadErr" class="load-err" style="display: none;"></div>
      </div>
      <div class="panel-events">
        <div class="tab-bar">
          <button class="active" data-tab="events">Event Log</button>
          <button data-tab="viz">Visualization</button>
        </div>
        <!-- Event Log tab -->
        <div class="tab-content active" id="tabEvents">
          <div class="event-log-header">
            <span>Event log</span>
            <span>
              <button type="button" id="jumpToBottom" class="btn-jump" title="Scroll to latest">Jump to bottom</button>
              <button type="button" id="clearEvents" class="btn-clear" title="Clear event log">Clear</button>
            </span>
          </div>
          <div id="eventLogContent" class="event-log-content">
            <div id="eventLogEmpty" class="event-log-empty">Select a port to connect and see device events (e.g. TWR range, logs) here.</div>
            <div id="eventLogLines"></div>
          </div>
        </div>
        <!-- Visualization tab -->
        <div class="tab-content" id="tabViz">
          <div class="viz-panel">
            <div class="viz-canvas-wrap">
              <canvas id="vizCanvas"></canvas>
            </div>
            <div class="viz-toolbar">
              <button type="button" id="vizClear" title="Clear trail & ranges">Clear</button>
              <label>Bounds X:</label>
              <input type="text" id="vizMinX" value="-0.5" style="width:3rem" />
              <span>to</span>
              <input type="text" id="vizMaxX" value="6" style="width:3rem" />
              <label>Y:</label>
              <input type="text" id="vizMinY" value="-0.5" style="width:3rem" />
              <span>to</span>
              <input type="text" id="vizMaxY" value="4.5" style="width:3rem" />
              <span class="viz-status" id="vizStatus">No data</span>
            </div>
            <div class="anchor-config" id="anchorConfig">
              <table>
                <thead><tr><th>Addr</th><th>Label</th><th>X</th><th>Y</th><th>Z</th><th></th><th></th></tr></thead>
                <tbody id="anchorRows"></tbody>
              </table>
              <button type="button" class="btn-add" id="addAnchor" style="margin-top:0.2rem">+ Add anchor</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const portEl = document.getElementById("port");
    const searchEl = document.getElementById("search");
    const commandListEl = document.getElementById("commandList");
    const noResultsEl = document.getElementById("noResults");
    const loadErrEl = document.getElementById("loadErr");
    const eventLogLinesEl = document.getElementById("eventLogLines");
    const eventLogEmptyEl = document.getElementById("eventLogEmpty");
    const eventLogContentEl = document.getElementById("eventLogContent");
    const monitorBtn = document.getElementById("monitorBtn");
    const monitorStatusEl = document.getElementById("monitorStatus");
    const commRouteEl = document.getElementById("commRoute");
    const transportStatusEl = document.getElementById("transportStatus");

    let allCommands = [];
    let moduleOrder = [];
    let eventLogEntries = [];
    let eventStreamSource = null;
    const LAST_PORT_KEY = "hylo:lastPort";
    const LAST_ROUTE_KEY = "hylo:lastRoute";

    async function loadPorts() {
      const savedPort = localStorage.getItem(LAST_PORT_KEY) || "";
      const currentPort = portEl.value;
      try {
        const r = await fetch("/api/ports");
        if (!r.ok) throw new Error(await r.text());
        const { ports } = await r.json();
        portEl.innerHTML = '<option value="">Select port</option>' +
          ports.map(p => `<option value="${p.device}">${p.device} — ${p.description || ""}</option>`).join("");
        if (currentPort && portEl.querySelector(`option[value="${currentPort}"]`)) {
          portEl.value = currentPort;
        } else if (savedPort && portEl.querySelector(`option[value="${savedPort}"]`)) {
          portEl.value = savedPort;
        }
      } catch (e) {
        portEl.innerHTML = '<option value="">No ports</option>';
      }
    }

    function loadSavedRoute() {
      const savedRoute = (localStorage.getItem(LAST_ROUTE_KEY) || "uart").toLowerCase();
      commRouteEl.value = savedRoute === "wifi" ? "wifi" : "uart";
    }

    function isEventLogAtBottom() {
      const el = eventLogContentEl;
      return el.scrollHeight - el.clientHeight - el.scrollTop <= 50;
    }

    function appendEvents(events) {
      if (!events || events.length === 0) return;
      const wasAtBottom = isEventLogAtBottom();
      eventLogEntries = eventLogEntries.concat(events);
      eventLogEmptyEl.style.display = "none";
      events.forEach(text => {
        const line = document.createElement("div");
        line.className = "event-log-line";
        const safe = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        line.innerHTML = safe.replace(/^(\[rx\]\s*)/, "<span class=\"event-prefix\">$1</span>");
        eventLogLinesEl.appendChild(line);
      });
      if (wasAtBottom) eventLogContentEl.scrollTop = eventLogContentEl.scrollHeight;
    }

    function renderEventLog() {
      const wasAtBottom = eventLogEntries.length === 0 || isEventLogAtBottom();
      eventLogLinesEl.innerHTML = "";
      if (eventLogEntries.length === 0) {
        eventLogEmptyEl.style.display = "block";
        return;
      }
      eventLogEmptyEl.style.display = "none";
      eventLogEntries.forEach(text => {
        const line = document.createElement("div");
        line.className = "event-log-line";
        const safe = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        line.innerHTML = safe.replace(/^(\[rx\]\s*)/, "<span class=\"event-prefix\">$1</span>");
        eventLogLinesEl.appendChild(line);
      });
      if (wasAtBottom) eventLogContentEl.scrollTop = eventLogContentEl.scrollHeight;
    }

    async function loadEvents() {
      try {
        const r = await fetch("/api/events");
        if (!r.ok) return;
        const data = await r.json();
        eventLogEntries = data.events || [];
        renderEventLog();
      } catch (e) { /* ignore */ }
    }

    function connectEventStream() {
      if (eventStreamSource) return;
      
      eventStreamSource = new EventSource("/api/events/stream");

      // 1. Handle the new status updates for auto-refresh
      eventStreamSource.addEventListener("status_update", (e) => {
        try {
          updateMonitorStatus(); 
        } catch (err) { console.error(err); }
      });

      // 2. Handle Visualization data
      eventStreamSource.addEventListener("viz", (e) => {
        try { 
          handleVizEvent(JSON.parse(e.data)); 
        } catch (err) { /* ignore */ }
      });

      // 3. Handle standard log lines
      eventStreamSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.line) appendEvents([data.line]);
        } catch (err) { /* ignore */ }
      };

      eventStreamSource.onerror = () => {
        if (eventStreamSource) {
          eventStreamSource.close();
          eventStreamSource = null;
        }
      };
      
      loadEvents();
    }

    function disconnectEventStream() {
      if (eventStreamSource) {
        eventStreamSource.close();
        eventStreamSource = null;
      }
    }

    async function updateMonitorStatus() {
      try {
        const r = await fetch("/api/monitor/status");
        if (!r.ok) return;
        const data = await r.json();
        const route = (data.route || "uart").toLowerCase();
        const active = !!data.active;
        monitorBtn.textContent = active ? "Stop monitoring" : "Start monitoring";
        monitorBtn.classList.toggle("active", !!active);
        monitorBtn.disabled = route === "uart" ? (!portEl.value && !active) : false;
        if (active) {
          monitorStatusEl.textContent = route === "wifi"
            ? "Monitoring WiFi"
            : ("Monitoring " + (data.port || "UART"));
          monitorStatusEl.style.display = "inline";
        } else {
          monitorStatusEl.style.display = "none";
        }

        connectEventStream();

        commRouteEl.value = route === "wifi" ? "wifi" : "uart";
        const wifi = data.wifi_server || {};
        transportStatusEl.style.display = "inline";
        
        let wifiStatusText = `Route: ${route.toUpperCase()}`;
        if (route === "wifi") {
          const espConnected = wifi.connected ? "✓ ESP connected" : "✗ ESP waiting";
          const clientInfo = wifi.client ? ` (${wifi.client})` : "";
          wifiStatusText += ` | WiFi ${espConnected}${clientInfo} | Server ${wifi.host || "0.0.0.0"}:${wifi.port || "5000"}`;
          transportStatusEl.style.color = wifi.connected ? "#4ec94e" : "#ffa500";
        } else {
          transportStatusEl.style.color = "";
        }
        transportStatusEl.textContent = wifiStatusText;
      } catch (e) { /* ignore */ }
    }

    async function selectRoute(route) {
      try {
        const r = await fetch("/api/route/select", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ route })
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(err.detail || "Failed to select route");
          return;
        }
        const data = await r.json();
        if (data.events && data.events.length) appendEvents(data.events);
        localStorage.setItem(LAST_ROUTE_KEY, route);
        await updateMonitorStatus();
      } catch (e) {
        alert(e.message || "Failed to select route");
      }
    }

    async function sendCommand(port, command, args, responseEl, responseRow, sendBtn) {
      const route = commRouteEl.value === "wifi" ? "wifi" : "uart";
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending…";
      responseEl.textContent = "Sending…";
      responseEl.className = "command-response pending";
      responseRow.classList.remove("has-success");
      try {
        const r = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ port, command, args, route })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          responseEl.textContent = data.detail || r.statusText;
          responseEl.className = "command-response error";
          return;
        }
        const responseText = data.response ?? (data.success ? "OK" : "Error");
        responseEl.textContent = responseText;
        responseEl.className = "command-response " + (data.success ? "success" : "error");
        if (data.success && responseText) responseRow.classList.add("has-success");
        if (data.events && data.events.length) appendEvents(data.events);
      } catch (e) {
        responseEl.textContent = e.message;
        responseEl.className = "command-response error";
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
      }
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function renderCommand(cmd) {
      const argsHtml = cmd.args.length === 0
        ? ""
        : cmd.args.map(a => {
            if (a.type === "choice") {
              return `<div class="arg-group"><label>${escapeHtml(a.name)}</label><select data-arg="${escapeHtml(a.name)}">${a.choices.map(c => `<option value="${c}">${escapeHtml(c)}</option>`).join("")}</select></div>`;
            }
            return `<div class="arg-group"><label>${escapeHtml(a.name)}</label><input type="text" data-arg="${escapeHtml(a.name)}" placeholder="${escapeHtml(a.type)}"/></div>`;
          }).join("");
      const module = escapeHtml(cmd.module || "Other");
      return `
        <div class="command" data-command="${escapeHtml(cmd.command)}" data-module="${module}" data-search="${escapeHtml((cmd.command + " " + cmd.description).toLowerCase())}">
          <div class="command-header">
            <span class="command-name">${escapeHtml(cmd.command)}</span>
            <span class="command-desc">${escapeHtml(cmd.description)}</span>
          </div>
          <div class="command-form">
            ${argsHtml}
            <button type="button" data-send="${escapeHtml(cmd.command)}">Send</button>
          </div>
          <div class="command-response-row">
            <div class="command-response"></div>
            <button type="button" class="copy-response" title="Copy response">Copy</button>
          </div>
        </div>`;
    }

    function applyFilter() {
      const q = (searchEl.value || "").trim().toLowerCase();
      let visible = 0;
      commandListEl.querySelectorAll(".command").forEach(el => {
        const match = !q || (el.getAttribute("data-search") || "").includes(q);
        el.classList.toggle("hidden", !match);
        if (match) visible++;
      });
      commandListEl.querySelectorAll(".module-section").forEach(section => {
        const moduleCommands = section.querySelectorAll(".command");
        const anyVisible = Array.from(moduleCommands).some(el => !el.classList.contains("hidden"));
        section.classList.toggle("hidden", !anyVisible);
      });
      noResultsEl.style.display = visible === 0 && allCommands.length > 0 ? "block" : "none";
    }

    function renderCommands(commands, order) {
      allCommands = commands || [];
      moduleOrder = order || [];
      if (allCommands.length === 0) {
        loadErrEl.style.display = "block";
        loadErrEl.textContent = "No commands (run from repo root; ensure host.serial.protocol_tool is available).";
        commandListEl.innerHTML = "";
        noResultsEl.style.display = "none";
        return;
      }
      loadErrEl.style.display = "none";
      const byModule = {};
      allCommands.forEach(c => {
        const m = c.module || "Other";
        if (!byModule[m]) byModule[m] = [];
        byModule[m].push(c);
      });
      const sectionOrder = moduleOrder.length ? moduleOrder : [...new Set(allCommands.map(c => c.module || "Other"))];
      const sectionsHtml = sectionOrder.map(moduleLabel => {
        const list = byModule[moduleLabel];
        if (!list || list.length === 0) return "";
        const safeLabel = escapeHtml(moduleLabel);
        const cards = list.map(c => renderCommand(c)).join("");
        return `<div class="module-section collapsed" data-module="${safeLabel}"><div class="module-header">${safeLabel}</div><div class="module-commands">${cards}</div></div>`;
      }).join("");
      const otherLabels = Object.keys(byModule).filter(m => !sectionOrder.includes(m));
      const restHtml = otherLabels.map(moduleLabel => {
        const list = byModule[moduleLabel];
        const safeLabel = escapeHtml(moduleLabel);
        const cards = list.map(c => renderCommand(c)).join("");
        return `<div class="module-section collapsed" data-module="${safeLabel}"><div class="module-header">${safeLabel}</div><div class="module-commands">${cards}</div></div>`;
      }).join("");
      commandListEl.innerHTML = sectionsHtml + restHtml;

      commandListEl.querySelectorAll(".module-header").forEach(h => {
        h.addEventListener("click", () => h.closest(".module-section").classList.toggle("collapsed"));
      });

      commandListEl.querySelectorAll("[data-send]").forEach(btn => {
        btn.addEventListener("click", () => {
          const isUart = commRouteEl.value === "uart";
          if (isUart && !portEl.value) {
            const resp = btn.closest(".command").querySelector(".command-response");
            resp.textContent = "Select a port first.";
            resp.className = "command-response error";
            return;
          }
          const command = btn.getAttribute("data-send");
          const form = btn.closest(".command-form");
          const args = [];
          form.querySelectorAll("[data-arg]").forEach(inp => args.push(inp.value.trim()));
          const commandCard = btn.closest(".command");
          const responseEl = commandCard.querySelector(".command-response");
          const responseRow = commandCard.querySelector(".command-response-row");
          const selectedPort = isUart ? portEl.value : null;
          sendCommand(selectedPort, command, args, responseEl, responseRow, btn);
        });
      });

      commandListEl.querySelectorAll(".copy-response").forEach(copyBtn => {
        copyBtn.addEventListener("click", async () => {
          const responseEl = copyBtn.closest(".command-response-row").querySelector(".command-response");
          const text = responseEl.textContent.trim();
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
            const orig = copyBtn.textContent;
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = orig; }, 1200);
          } catch (e) {
            copyBtn.textContent = "Failed";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
          }
        });
      });

      applyFilter();
    }

    searchEl.addEventListener("input", applyFilter);
    document.getElementById("refreshPorts").addEventListener("click", loadPorts);
    commRouteEl.addEventListener("change", async () => {
      const nextRoute = commRouteEl.value === "wifi" ? "wifi" : "uart";
      await selectRoute(nextRoute);
    });
    monitorBtn.addEventListener("click", async () => {
      try {
        const r = await fetch("/api/monitor/status");
        if (!r.ok) return;
        const data = await r.json();
        const route = ((data.route || commRouteEl.value || "uart") === "wifi") ? "wifi" : "uart";
        if (data.active) {
          await fetch("/api/monitor/stop", { method: "POST" });
        } else {
          if (route === "uart" && !portEl.value) return;
          const res = await fetch("/api/monitor/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ port: route === "uart" ? portEl.value : null })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.detail || "Failed to start monitoring");
            return;
          }
        }
        await updateMonitorStatus();
        if (!data.active) await loadEvents();
      } catch (e) { /* ignore */ }
    });
    document.getElementById("jumpToBottom").addEventListener("click", () => {
      eventLogContentEl.scrollTop = eventLogContentEl.scrollHeight;
    });
    document.getElementById("clearEvents").addEventListener("click", async () => {
      try {
        await fetch("/api/events/clear", { method: "POST" });
        eventLogEntries = [];
        renderEventLog();
      } catch (e) { /* ignore */ }
    });

    async function loadCommands() {
      try {
        const r = await fetch("/api/commands");
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        renderCommands(data.commands || [], data.module_order || []);
      } catch (e) {
        loadErrEl.style.display = "block";
        loadErrEl.textContent = "Failed to load commands: " + e.message;
      }
    }

    async function connectPort() {
      const port = portEl.value;
      if (port) localStorage.setItem(LAST_PORT_KEY, port);
      try {
        if (port) {
          const res = await fetch("/api/monitor/start", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ port })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            console.warn("Monitor start failed:", err.detail || res.statusText);
          }
        } else {
          await fetch("/api/monitor/stop", { method: "POST" });
        }
        await updateMonitorStatus();
        await loadEvents();
      } catch (e) { /* ignore */ }
    }

    async function initApp() {
      loadSavedRoute();
      await selectRoute(commRouteEl.value === "wifi" ? "wifi" : "uart");
      connectEventStream();
      await loadPorts();
      await loadCommands();
      await loadEvents();
      await updateMonitorStatus();
    }
    initApp();
    portEl.addEventListener("change", async () => {
      const port = portEl.value;
      if (port) localStorage.setItem(LAST_PORT_KEY, port);
      await updateMonitorStatus();
    });

    // ===================== Tab switching =====================
    const appMainEl = document.querySelector(".app-main");
    document.querySelectorAll(".tab-bar button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-bar button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        const isViz = btn.dataset.tab === "viz";
        document.getElementById(isViz ? "tabViz" : "tabEvents").classList.add("active");
        appMainEl.classList.toggle("viz-active", isViz);
        if (isViz) setTimeout(vizResize, 50);
      });
    });

    // ===================== Indoor Visualization =====================
    const vizCanvas = document.getElementById("vizCanvas");
    const ctx = vizCanvas.getContext("2d");
    const vizStatusEl = document.getElementById("vizStatus");

    // Visualization state
    const vizState = {
      position: { x: 0, y: 0, z: 0 },
      positionKnown: false,
      ranges: {},   // addr -> { distance_m }
      trail: [],    // [{x,y}]
      anchors: {},  // addr -> {x,y,z,label}
    };
    const ANCHOR_COLORS = [
      "#ff4444", "#44ff44", "#4488ff", "#ffff44",
      "#ff44ff", "#44ffff", "#ff8844", "#aa44ff"
    ];

    function vizBounds() {
      return {
        minX: parseFloat(document.getElementById("vizMinX").value) || -0.5,
        maxX: parseFloat(document.getElementById("vizMaxX").value) || 6,
        minY: parseFloat(document.getElementById("vizMinY").value) || -0.5,
        maxY: parseFloat(document.getElementById("vizMaxY").value) || 4.5,
      };
    }

    function vizResize() {
      const wrap = vizCanvas.parentElement;
      const rect = wrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      vizCanvas.width = rect.width * dpr;
      vizCanvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      vizDraw();
    }
    window.addEventListener("resize", () => {
      if (document.getElementById("tabViz").classList.contains("active")) vizResize();
    });

    function mapX(x, b, w, pad) { return pad + (x - b.minX) / (b.maxX - b.minX) * (w - 2 * pad); }
    function mapY(y, b, h, pad) { return h - pad - (y - b.minY) / (b.maxY - b.minY) * (h - 2 * pad); }

    function vizDraw() {
      const dpr = window.devicePixelRatio || 1;
      const w = vizCanvas.width / dpr;
      const h = vizCanvas.height / dpr;
      if (w < 10 || h < 10) return;
      const b = vizBounds();
      const pad = 40;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0d1117";
      ctx.fillRect(0, 0, w, h);

      // Grid
      ctx.strokeStyle = "#1e2430";
      ctx.lineWidth = 1;
      for (let x = Math.ceil(b.minX); x <= b.maxX; x += 0.5) {
        const sx = mapX(x, b, w, pad);
        ctx.beginPath(); ctx.moveTo(sx, pad); ctx.lineTo(sx, h - pad); ctx.stroke();
      }
      for (let y = Math.ceil(b.minY); y <= b.maxY; y += 0.5) {
        const sy = mapY(y, b, h, pad);
        ctx.beginPath(); ctx.moveTo(pad, sy); ctx.lineTo(w - pad, sy); ctx.stroke();
      }

      // Axis lines at 0
      ctx.strokeStyle = "#3a4255";
      ctx.lineWidth = 1.5;
      const ox = mapX(0, b, w, pad), oy = mapY(0, b, h, pad);
      if (b.minX <= 0 && 0 <= b.maxX) { ctx.beginPath(); ctx.moveTo(ox, pad); ctx.lineTo(ox, h - pad); ctx.stroke(); }
      if (b.minY <= 0 && 0 <= b.maxY) { ctx.beginPath(); ctx.moveTo(pad, oy); ctx.lineTo(w - pad, oy); ctx.stroke(); }

      // Axis labels
      ctx.fillStyle = "#565f89";
      ctx.font = "11px monospace";
      ctx.textAlign = "center";
      for (let x = Math.ceil(b.minX); x <= b.maxX; x += 1) {
        ctx.fillText(x.toFixed(0), mapX(x, b, w, pad), h - pad + 16);
      }
      ctx.textAlign = "right";
      for (let y = Math.ceil(b.minY); y <= b.maxY; y += 1) {
        ctx.fillText(y.toFixed(0), pad - 8, mapY(y, b, h, pad) + 4);
      }
      ctx.textAlign = "center";
      ctx.fillText("X (m)", w / 2, h - 6);
      ctx.save();
      ctx.translate(12, h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("Y (m)", 0, 0);
      ctx.restore();

      // Ranging rings + anchors
      const anchorKeys = Object.keys(vizState.anchors);
      anchorKeys.forEach((addr, i) => {
        const a = vizState.anchors[addr];
        const sx = mapX(a.x, b, w, pad);
        const sy = mapY(a.y, b, h, pad);
        const col = ANCHOR_COLORS[i % ANCHOR_COLORS.length];
        // Ranging ring
        const range = vizState.ranges[addr];
        if (range && range.distance_m > 0) {
          const pixPerMeter = (w - 2 * pad) / (b.maxX - b.minX);
          const r = range.distance_m * pixPerMeter;
          ctx.strokeStyle = col;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.25;
          ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 0.06;
          ctx.fillStyle = col;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
        // Anchor dot
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
        // Label
        ctx.fillStyle = "#c0caf5";
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.fillText(a.label || ("A" + addr), sx, sy - 12);
        if (range && range.distance_m > 0) {
          ctx.font = "10px monospace";
          ctx.fillText(range.distance_m.toFixed(2) + "m", sx, sy + 20);
        }
      });

      // Trail
      if (vizState.trail.length > 1) {
        ctx.strokeStyle = "rgba(122,162,247,0.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        vizState.trail.forEach((p, i) => {
          const sx = mapX(p.x, b, w, pad), sy = mapY(p.y, b, h, pad);
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        });
        ctx.stroke();
      }

      // Tag position
      if (vizState.positionKnown) {
        const tx = mapX(vizState.position.x, b, w, pad);
        const ty = mapY(vizState.position.y, b, h, pad);
        // Crosshair
        ctx.strokeStyle = "#9ece6a";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(tx - 10, ty); ctx.lineTo(tx + 10, ty); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx, ty - 10); ctx.lineTo(tx, ty + 10); ctx.stroke();
        // Dot
        ctx.fillStyle = "#9ece6a";
        ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill();
        // Coords
        ctx.fillStyle = "#9ece6a";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`(${vizState.position.x.toFixed(2)}, ${vizState.position.y.toFixed(2)})`, tx, ty + 22);
      }

      // Legend
      ctx.textAlign = "left";
      let ly = 16;
      ctx.font = "bold 11px monospace";
      ctx.fillStyle = "#c0caf5";
      ctx.fillText("Legend:", pad + 4, ly); ly += 18;
      anchorKeys.forEach((addr, i) => {
        const a = vizState.anchors[addr];
        const col = ANCHOR_COLORS[i % ANCHOR_COLORS.length];
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(pad + 10, ly - 4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c0caf5";
        ctx.font = "10px monospace";
        ctx.fillText(a.label || ("Anchor " + addr), pad + 20, ly);
        ly += 16;
      });
      if (vizState.positionKnown) {
        ctx.fillStyle = "#9ece6a";
        ctx.beginPath(); ctx.arc(pad + 10, ly - 4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c0caf5";
        ctx.font = "10px monospace";
        ctx.fillText("Tag Position", pad + 20, ly);
      }
    }

    // ===================== SSE viz event handler =====================
    function handleVizEvent(data) {
      if (!data.position_unknown) {
        vizState.position = { x: data.x, y: data.y, z: data.z };
        vizState.positionKnown = true;
        vizState.trail.push({ x: data.x, y: data.y });
        if (vizState.trail.length > 200) vizState.trail.shift();
      }
      vizState.ranges[String(data.addr)] = { distance_m: data.distance_m };
      vizStatusEl.textContent = `Tag: (${data.x.toFixed(2)}, ${data.y.toFixed(2)}) | Addr: 0x${data.addr.toString(16).toUpperCase()}`;
      if (document.getElementById("tabViz").classList.contains("active")) {
        requestAnimationFrame(vizDraw);
      }
    }

    // Patch the existing SSE connection to also listen for viz events
    const origConnectEventStream = connectEventStream;
    connectEventStream = function() {
    
      origConnectEventStream();
      if (eventStreamSource) {
        eventStreamSource.addEventListener("viz", (e) => {
          try { handleVizEvent(JSON.parse(e.data)); } catch (err) { /* ignore */ }
        });
      }
    };

    // ===================== Anchor configuration =====================
    const anchorRowsEl = document.getElementById("anchorRows");
    const defaultAnchors = {
      "0": { x: 4.915, y: 3.758, z: 0, label: "B0" },
      "1": { x: 0.877, y: 0.020, z: 0, label: "B1" },
      "2": { x: 0.828, y: 4.018, z: 0, label: "B2" },
      "3": { x: 4.904, y: 0.460, z: 0, label: "B3" },
    };

    function loadAnchors() {
      try {
        const saved = localStorage.getItem("hylo_viz_anchors");
        if (saved) return JSON.parse(saved);
      } catch (e) { /* ignore */ }
      return defaultAnchors;
    }

    function saveAnchors() {
      const anchors = {};
      anchorRowsEl.querySelectorAll("tr").forEach(tr => {
        const addr = tr.querySelector("[data-field=addr]").value.trim();
        if (!addr) return;
        anchors[addr] = {
          x: parseFloat(tr.querySelector("[data-field=x]").value) || 0,
          y: parseFloat(tr.querySelector("[data-field=y]").value) || 0,
          z: parseFloat(tr.querySelector("[data-field=z]").value) || 0,
          label: tr.querySelector("[data-field=label]").value.trim() || ("A" + addr),
        };
      });
      localStorage.setItem("hylo_viz_anchors", JSON.stringify(anchors));
      vizState.anchors = anchors;
      fetch("/api/viz/anchors", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ anchors })
      }).catch(() => {});
      vizDraw();
    }

    function renderAnchorRow(addr, a) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input data-field="addr" value="${escapeHtml(addr)}" style="width:3.5rem" /></td>
        <td><input data-field="label" value="${escapeHtml(a.label || "")}" style="width:3.5rem" /></td>
        <td><input data-field="x" type="number" step="0.01" value="${a.x}" /></td>
        <td><input data-field="y" type="number" step="0.01" value="${a.y}" /></td>
        <td><input data-field="z" type="number" step="0.01" value="${a.z}" /></td>
        <td><button class="btn-apply" title="Send OtaConfigSendPositionRequest to device">Apply</button></td>
        <td><button class="btn-del" title="Remove">✕</button></td>`;
      tr.querySelector(".btn-del").addEventListener("click", () => { tr.remove(); saveAnchors(); });
      tr.querySelector(".btn-apply").addEventListener("click", () => applyAnchorPosition(tr));
      tr.querySelectorAll("input").forEach(inp => inp.addEventListener("change", saveAnchors));
      anchorRowsEl.appendChild(tr);
    }

    async function applyAnchorPosition(tr) {
      const isUart = commRouteEl.value === "uart";
      const route = isUart ? "uart" : "wifi";
      const port = isUart ? portEl.value : null;
      if (isUart && !port) { alert("Select a port first."); return; }
      const addr = tr.querySelector("[data-field=addr]").value.trim();
      const x = tr.querySelector("[data-field=x]").value.trim();
      const y = tr.querySelector("[data-field=y]").value.trim();
      const z = tr.querySelector("[data-field=z]").value.trim();
      if (!addr) { alert("Anchor address is required."); return; }
      const btn = tr.querySelector(".btn-apply");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const r = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ port, route, command: "OtaConfigSendPositionRequest", args: [addr, x, y, z] })
        });
        const data = await r.json().catch(() => ({}));
        if (data.success) {
          btn.textContent = "✓ Sent";
          btn.classList.add("sent");
          if (data.events && data.events.length) appendEvents(data.events);
        } else {
          btn.textContent = "✕ Failed";
          btn.style.background = "var(--error)";
          btn.style.color = "#fff";
          console.warn("OtaConfigSendPosition failed:", data.response);
        }
      } catch (e) {
        btn.textContent = "✕ Error";
        btn.style.background = "var(--error)";
        btn.style.color = "#fff";
      }
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = "Apply";
        btn.className = "btn-apply";
        btn.style.background = "";
        btn.style.color = "";
      }, 2000);
    }

    function initAnchors() {
      const anchors = loadAnchors();
      vizState.anchors = anchors;
      Object.entries(anchors).forEach(([addr, a]) => renderAnchorRow(addr, a));
      fetch("/api/viz/anchors", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ anchors })
      }).catch(() => {});
    }

    document.getElementById("addAnchor").addEventListener("click", () => {
      const nextAddr = String(Object.keys(vizState.anchors).length);
      renderAnchorRow(nextAddr, { x: 0, y: 0, z: 0, label: "B" + nextAddr });
      saveAnchors();
    });

    document.getElementById("vizClear").addEventListener("click", async () => {
      vizState.trail = [];
      vizState.ranges = {};
      vizState.positionKnown = false;
      vizStatusEl.textContent = "No data";
      try { await fetch("/api/viz/clear", { method: "POST" }); } catch (e) { /* ignore */ }
      vizDraw();
    });

    // Redraw on bounds change
    ["vizMinX", "vizMaxX", "vizMinY", "vizMaxY"].forEach(id => {
      document.getElementById(id).addEventListener("change", vizDraw);
    });

    initAnchors();
    // Initial draw after a small delay so canvas has dimensions
    setTimeout(vizResize, 100);
  </script>
</body>
</html>
