# OpenOCD config for STM32H723XG (ST-Link DAP)
#
# Prefers stlink-dap interface (OpenOCD 0.11+) for direct DAP access.
# Falls back to stlink HLA interface for older OpenOCD distributions (e.g. MSYS2).
if { [catch { find interface/stlink-dap.cfg } dap_cfg] == 0 } {
    source $dap_cfg
    transport select dapdirect_swd
} else {
    source [find interface/stlink.cfg]
}

source [find target/stm32h7x.cfg]

adapter speed 4000

reset_config none
