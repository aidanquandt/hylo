syntax = "proto3";

import "nanopb.proto";
import "host_options.proto";

option (host.default_host_ui_module) = HOST_UI_MODULE_DATALOGGER;

message DataloggerGetTasksRequest {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_REQUEST;
}
message DataloggerGetTasksResponse {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_RESPONSE;
  repeated string task_names = 1 [(nanopb).max_count = 16, (nanopb).max_length = 32];
}

message DataloggerGetStatsRequest {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_REQUEST;
}
message DataloggerGetStatsResponse {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_RESPONSE;
  uint32 task_count = 1;
  uint32 free_heap = 2;
}

message DataloggerGetIdleCpuRequest {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_REQUEST;
}
message DataloggerGetIdleCpuResponse {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_RESPONSE;
  // Percent of CPU time spent in the idle task over the interval since the last sample (0–100).
  float idle_cpu_percent = 1;
}

message DataloggerTimingMissesEvent {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_EVENT;
  string task_name = 1 [(nanopb).max_length = 24];
  uint32 miss_count = 2;
  uint32 deadline_ms = 3;
  uint32 worst_latency_ms = 4;
}
message DataloggerLowMemoryEvent {
  option (host.host_message_type) = HOST_MESSAGE_TYPE_EVENT;
  uint32 bytes_free = 1;
}
